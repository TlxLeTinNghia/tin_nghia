<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="/login.css?v=544695ca">
    <script src="/password-toggle.js?v=4e587fc5" defer></script>
    <script src="/register.js?v=31fb8aef" defer></script>
</head>
<body>
<main>
    <h1>Tạo tài khoản</h1>

    <form id="register-form" method="post">
        <label for="register-username">Tên đăng nhập</label>
        <input id="register-username" name="userName"
               autocomplete="username" required>

        <label for="register-password">Mật khẩu</label>
        <div class="password-field">
            <input id="register-password" name="password" type="password"
                   autocomplete="new-password" required>
            <button type="button" class="password-toggle" aria-controls="register-password" aria-label="Xem mật khẩu">
                <svg class="password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="password-eye-slash" d="m3 3 18 18"/>
                </svg>
            </button>
        </div>

        <label for="register-confirm-password">Nhập lại mật khẩu</label>
        <div class="password-field">
            <input id="register-confirm-password" name="confirmPassword" type="password"
                   autocomplete="new-password" required>
            <button type="button" class="password-toggle" aria-controls="register-confirm-password" aria-label="Xem mật khẩu nhập lại">
                <svg class="password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="password-eye-slash" d="m3 3 18 18"/>
                </svg>
            </button>
        </div>

        <button type="submit" disabled>Đăng ký</button>
        <p id="register-message" class="auth-message" role="status"></p>
    </form>

    <p class="register-prompt">
        Đã có tài khoản?
        <a class="register-link" href="/login.html">Đăng nhập</a>
    </p>
</main>
</body>
</html>
