<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StationeryStore | Văn phòng phẩm</title>
    <link rel="stylesheet" href="/style.css?v=7547688e">
    <script src="/app.js?v=eb4b030c" defer></script>
    <script src="/account.js?v=bc262cb6" defer></script>
</head>
<body class="storefront">
    <header class="store-header">
        <div class="store-header-inner store-container">
            <a class="store-brand" href="/" aria-label="StationeryStore, trang chủ">
                <span aria-hidden="true">✎</span> StationeryStore
            </a>
            <form id="search-form" class="store-search" role="search" action="/" method="get">
                <label class="store-visually-hidden" for="search-input">Tìm sản phẩm</label>
                <div class="store-search-field">
                    <input type="search" name="keyword" id="search-input" autocomplete="off"
                           placeholder="Tìm bút, thước kẻ, sách giáo khoa…">
                    <button type="submit">Tìm kiếm</button>
                </div>
                <ul id="suggestions" class="store-suggestions" aria-label="Gợi ý tìm kiếm" hidden></ul>
            </form>
            <nav class="store-nav" aria-label="Điều hướng chính">
                <a href="/">Trang chủ</a>
                <a class="store-admin-link" href="/admin.html" hidden>Quản lý sản phẩm</a>
                <div class="store-account">
                    <a class="store-account-login" href="/login.html">Đăng nhập</a>
                    <span class="store-account-name" hidden></span>
                    <button class="store-account-logout" type="button" hidden>Đăng xuất</button>
                    <span class="store-account-message" role="status"></span>
                </div>
                <a href="/orders.html">Đơn mua</a>
            </nav>
        </div>
    </header>

    <main class="store-container store-content">
        <section class="store-hero" aria-labelledby="store-heading">
            <div class="store-hero-copy">
                <h1 id="store-heading">Văn phòng phẩm <em>mỗi ngày</em></h1>
                <a class="store-primary-link" href="#products">Xem sản phẩm <span aria-hidden="true">→</span></a>
            </div>
            <div class="store-hero-media">
                <img src="/Images/hero-stationery.jpg" alt="">
                <img src="/Images/hero-school-supplies.jpg" alt="" hidden>
            </div>
        </section>

        <section class="store-categories" aria-labelledby="categories-heading">
            <h2 id="categories-heading">Danh mục</h2>
            <ul id="category-grid" class="store-category-grid">
                <li>
                    <img class="store-category-image" src="/Images/default-stationery.jpg" alt="" width="56" height="56">
                    Sách giáo khoa
                </li>
                <li>
                    <img class="store-category-image" src="/Images/default-stationery.jpg" alt="" width="56" height="56">
                    Thước kẻ
                </li>
            </ul>
            <nav id="category-pagination" class="store-pagination" aria-label="Phân trang danh mục" hidden>
                <button type="button" id="category-previous">Danh mục trước</button>
                <button type="button" id="category-next">Danh mục sau</button>
            </nav>
        </section>

        <section id="products" class="store-products" aria-labelledby="products-heading">
            <h2 id="products-heading">Sản phẩm</h2>
            <div id="product-grid" class="store-product-grid" aria-busy="true"></div>
            <p id="product-status" class="store-product-status" role="status">Đang tải sản phẩm…</p>
            <nav class="store-pagination" aria-label="Phân trang sản phẩm" hidden>
                <button type="button" id="previous-page" disabled><span aria-hidden="true">‹</span> Trang trước</button>
                <span id="page-info" aria-live="polite"></span>
                <button type="button" id="next-page" disabled>Trang sau <span aria-hidden="true">›</span></button>
            </nav>
        </section>
    </main>
</body>
</html>
